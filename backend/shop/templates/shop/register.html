<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Honey Farm</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>

<body>

    <header>
        <nav>

            <div class="logo">
                🍯 Honey Farm
            </div>

            <div class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'login' %}">Login</a>
            </div>

        </nav>
    </header>


    <main class="products">

        <h1>Create Account</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="button"
            >
                Create Account
            </button>

        </form>

    </main>

</body>

</html>
